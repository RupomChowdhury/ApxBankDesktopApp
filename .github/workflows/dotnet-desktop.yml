name: .NET Desktop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.configuration }})
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ApexBank.sln

    - name: Build Solution (${{ matrix.configuration }} x64)
      run: dotnet build ApexBank.sln --configuration ${{ matrix.configuration }} -p:Platform=x64 --no-restore

    - name: Run Unit Tests
      run: dotnet test Tests/Tests.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal

    - name: Publish WinUI 3 Desktop App
      if: matrix.configuration == 'Release'
      run: dotnet publish ApexBank.WinUI/ApexBank.WinUI.csproj --configuration Release -p:Platform=x64 --output ./publish/winui

    - name: Publish WPF Desktop App
      if: matrix.configuration == 'Release'
      run: dotnet publish ApexBank.csproj --configuration Release --output ./publish/wpf

    - name: Upload WinUI 3 Desktop App
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: APX-Bank-WinUI-x64
        path: ./publish/winui/

    - name: Upload WPF Desktop App
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: APX-Bank-WPF
        path: ./publish/wpf/
